server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker internal DNS resolver (prevents startup failure when upstream isn't running)
  resolver 127.0.0.11 ipv6=off valid=1s;

  # Serve React SPA under /autismo/
  location = /autismo {
    return 308 /autismo/;
  }

  # Backend proxy under /autismo/: /autismo/backend/* -> http://web-server:3001/*
  location = /autismo/backend {
    return 308 /autismo/backend/;
  }

  location ^~ /autismo/backend/ {
    set $backend_upstream http://web-server:3001;

    # Strip /autismo/backend/ prefix: /autismo/backend/auth/login -> /auth/login
    rewrite ^/autismo/backend/?(.*)$ /$1 break;

    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # API proxy under /autismo/: /autismo/api/* -> http://api:8100/*
  location = /autismo/api {
    return 308 /autismo/api/;
  }

  location ^~ /autismo/api/ {
    set $api_upstream http://api:8100;

    # Strip /autismo/api/ prefix: /autismo/api/search -> /search
    rewrite ^/autismo/api/?(.*)$ /$1 break;

    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static assets from root path (used when /autismo prefix is stripped)
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ^~ /autismo/ {
    # Strip /autismo/ prefix so files are resolved from root build output
    rewrite ^/autismo/?(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # Static assets under /autismo/assets must never fall back to index.html
  location ^~ /autismo/assets/ {
    # Strip /autismo/ prefix: /autismo/assets/x.js -> /assets/x.js
    rewrite ^/autismo/?(.*)$ /$1 break;
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
