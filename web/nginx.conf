server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker internal DNS resolver (prevents startup failure when upstream isn't running)
  resolver 127.0.0.11 ipv6=off valid=1s;

  # Backend proxy (auth, user, recommendation, feedback): /backend/* -> http://web-server:3001/*
  location = /backend {
    return 308 /backend/;
  }

  location ^~ /backend/ {
    set $backend_upstream http://web-server:3001;

    # Strip /backend/ prefix: /backend/auth/login -> /auth/login
    rewrite ^/backend/?(.*)$ /$1 break;

    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # API reverse proxy: /api/* -> http://api:8100/*
  location = /api {
    return 308 /api/;
  }

  location ^~ /api/ {
    # Use a variable so Nginx resolves "api" at request time
    set $api_upstream http://api:8100;

    # Strip /api/ prefix: /api/foo -> /foo
    rewrite ^/api/?(.*)$ /$1 break;

    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
