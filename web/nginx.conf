server {
  listen 80;

  # Aggiungi il resolver Docker
  resolver 127.0.0.11 valid=30s;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # TRUCCO: Usare una variabile forza Nginx a risolvere il DNS a runtime
    # invece che all'avvio, prevenendo il crash se "api" non esiste.
    # Assicurati che la porta (es. :8000) sia corretta per il tuo backend.
    set $upstream_api http://api; 
    
    proxy_pass $upstream_api;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
